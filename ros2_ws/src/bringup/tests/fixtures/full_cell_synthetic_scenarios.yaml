schema_version: 2
verification_scope: synthetic_full_cell
scenarios:
  - name: nominal_mission
    setup: {safety: normal, motion_active: false}
    stimulus: {vision: target_then_depleted}
    expected: {mission_exit: quantity_reached, motion_submissions: 4, retract_count: 0}
    vr: []
  - name: target_depletion
    setup: {safety: normal, motion_active: false}
    stimulus: {vision: object_not_found}
    expected: {mission_exit: quantity_shortfall, motion_submissions: 1, retract_count: 0}
    vr: [VR-ICD-VIS-ORCH-02]
  - name: vision_error
    setup: {safety: normal, motion_active: false}
    stimulus: {vision: timeout}
    expected: {mission_exit: vision_error, motion_submissions: 1, retract_count: 0}
    vr: [VR-ICD-VIS-ORCH-02]
  - name: motion_failure
    setup: {safety: normal, motion_active: false}
    stimulus: {motion_result: backend_error}
    expected: {mission_exit: motion_error, motion_submissions: 1, retract_count: 0}
    vr: []
  - name: controlled_stop
    setup: {safety: normal, motion_active: true}
    stimulus: {safety_condition: controlled_interlock}
    expected: {mission_exit: safety_preempted, terminal_motion_state: stopped, retract_count: 1}
    vr: [VR-ICD-SAFE-MOT-06, VR-ICD-ORCH-CYCLE-03]
  - name: immediate_stop
    setup: {safety: normal, motion_active: true}
    stimulus: {safety_condition: immediate_interlock}
    expected: {mission_exit: safety_preempted, terminal_motion_state: stopped, retract_count: 1}
    vr: [VR-ICD-SAFE-MOT-06, VR-ICD-ORCH-CYCLE-03]
  - name: emergency_stop
    setup: {safety: normal, motion_active: true}
    stimulus: {safety_condition: emergency_stop}
    expected: {mission_exit: safety_preempted, terminal_motion_state: stopped, retract_count: 0}
    vr: [VR-ICD-ORCH-CYCLE-03]
  - name: communication_loss
    setup: {safety: normal, motion_active: true}
    stimulus: {external_fault: communication_loss}
    expected: {required_inputs_fresh_during_loss: false, motion_capability_during_loss: none, required_inputs_fresh_after_restore: true, recovery_capability_after_restore: normal, latched_until_reset: false}
    vr: []
  - name: recovery_success
    setup: {safety: normal, motion_active: true}
    stimulus: {safety_condition: controlled_interlock, retract_result: success}
    expected: {mission_exit: safety_preempted, terminal_motion_state: stopped, retract_count: 1}
    vr: [VR-ICD-SAFE-MOT-06, VR-ICD-ORCH-CYCLE-03]
  - name: recovery_failure
    setup: {safety: normal, motion_active: true}
    stimulus: {safety_condition: controlled_interlock, retract_result: path_obstructed}
    expected: {mission_exit: safety_preempted, retract_count: 1, recovery_result: path_obstructed, retry_count: 0}
    vr: [VR-ICD-SAFE-MOT-06, VR-ICD-ORCH-CYCLE-03]
  - name: mission_cancellation
    setup: {safety: normal, motion_active: false}
    stimulus: {caller: cancel_before_start}
    expected: {mission_exit: cancelled}
    vr: [VR-ICD-ORCH-CYCLE-03]
  - name: capability_downgrade
    setup: {safety: normal, motion_active: false}
    stimulus: {safety_capability: recovery_only, task: go_home}
    expected: {normal_task_result: permission_denied, retract_result: permitted, retry_count: 0}
    vr: [VR-ICD-SAFE-MOT-02]
