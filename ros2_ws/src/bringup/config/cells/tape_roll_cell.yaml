display_name: Tape Handling Cell
isaac:
  scene_builder: tape_roll_cell.scene:build_scene
  robot_prim_path: /World/Robot
  configuration_compiler: tape_roll_cell.configuration:compile_cell
  material_supply_factory: tape_roll_cell.cell_runtime:create_adapter
  action_graph_builder: tape_roll_cell.runtime:build_action_graph
  camera_snapshot: tape_roll_cell.runtime:snapshot_camera
  action_graph_path: /World/TapeRollCell/ROS2/ActionGraph
  operator_ui: tape_roll_cell.runtime:enable_operator_ui
tape_roll:
  insertion_depth_m: 0.014
  supply_center_m:
  - 0.53
  - 0.35
  # Lower the infeed and pick datum by the added 85 mm of extraction lift.
  - 0.415
  extract_lift_m: 0.10
  release_clearance_m: 0.004
  move_duration_s: 1.0
  material: package://arm_cell_bringup/config/materials/tape_roll/17mm.yaml
  place:
    # Move both support rails and the place datum 100 mm away from the robot.
    first_center_xy_m: [0.3, -0.35]
    surface_z_m: 0.3
    approach_clearance_m: 0.08
    transport_height_m: 0.72
    yaw_rad: 0.0
    turn_position_m: [0.3, -0.35, 0.38]
    tool_overrides:
      hand_e_c10:
        surface_z_m: 0.38
        turn_position_m: [0.3, -0.35, 0.46]
  cartridge:
    slot_count: 15
    slot_spacing_m: 0.03
    axis:
    - 1.0
    - 0.0
    - 0.0
world_to_base:
  x: 0.0
  y: 0.0
  z: 0.0
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
configured_supply:
  supply_id: tape_cartridge
  material_id: TapeRoll17
presentation:
  overview:
    eye: [2.2, -2.1, 1.7]
    target: [0.6, -0.35, 0.3]
environment:
  floor_z_m: -0.3
  floor_thickness_m: 0.06
  floor_size_m: [6.0, 6.0]
  robot_support_top_z_m: 0.0
  robot_support_size_m: [0.32, 0.32]
conveyor:
  max_cartridges: 8
  movement_timeout_s: 90.0
  inlet_front_x_m: 1.12
  minimum_front_x_m: 0.05
  speed_m_s: 0.04
  acceleration_m_s2: 0.06
  position_tolerance_m: 0.002
  settle_s: 0.25
  drive_stiffness_n_m: 3000.0
  drive_damping_ns_m: 300.0
  drive_force_n: 120.0
  infeed_length_m: 1.06
  infeed_center_x_m: 1.09
  outfeed_length_m: 1.3
  outfeed_speed_m_s: 0.06
  outfeed_pitch_m: 0.18
