motion:
  tool_axis_quaternion_xyzw:
  - 1.0
  - 0.0
  - 0.0
  - 0.0
  insertion_axis_tcp:
  - 0.0
  - 0.0
  - 1.0
vision:
  finger_contact_width_m: 0.02
  finger_height_m: 0.03
capture: project://infra/isaac_sim/config/gripper_capture.yaml
tool_id: robotiq_2f85
grasp_motion:
  finger_clearance_radius_m: 0.01
  finger_contact_span_m: 0.02
  finger_clearance_depth_m: 0.025
validation_motion:
  validation_grasp_contact_links:
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link
validation_planning_scene:
  attachment_link: gripper_robotiq_85_base_link
  touch_links:
  - gripper_robotiq_85_left_finger_link
  - gripper_robotiq_85_right_finger_link
# Physical Tool links only. Motion adds the canonical TCP attachment link.
contact_links:
  payload_touch_links:
  - gripper_robotiq_85_left_finger_link
  - gripper_robotiq_85_right_finger_link
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link
  - gripper_robotiq_85_left_inner_knuckle_link
  - gripper_robotiq_85_right_inner_knuckle_link
  # Production PICK Retract contacts, independent of fixture validation policy.
  pick_retract:
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link

# Isaac implementation and optional capabilities are Tool-owned.
runtime:
  implementation: robotiq_2f85
  capabilities: [width, parallel_grasp]
  max_width_mm: 85.0
  move_duration_s: 0.40
  supported_shapes: [box]

# Geometry checked at requested TCP poses; independent of contact exceptions.
grasp_pose_collision_links:
  - gripper_robotiq_85_base_link
  - gripper_robotiq_85_left_knuckle_link
  - gripper_robotiq_85_right_knuckle_link
  - gripper_robotiq_85_left_inner_knuckle_link
  - gripper_robotiq_85_right_inner_knuckle_link
  - gripper_robotiq_85_left_finger_link
  - gripper_robotiq_85_right_finger_link
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link
