motion:
  tool_axis_quaternion_xyzw:
  - 1.0
  - 0.0
  - 0.0
  - 0.0
  insertion_axis_tcp:
  - 0.0
  - 0.0
  - 1.0
vision:
  finger_contact_width_m: 0.02
  finger_height_m: 0.03
capture: project://infra/isaac_sim/config/gripper_capture.yaml
tool_id: robotiq_2f85
tool_type: parallel_gripper
# Manufacturer 20..235 N PER FINGER, normalized to bilateral total N.
# 2024-04-02 Robotiq instruction manual table 5-1 and figure 5-11.
force_limits:
  min_total_force_n: 40.0
  max_total_force_n: 470.0
  source: https://s3.amazonaws.com/com-robotiq-website-prod-assets/website-assets/support_documents/document/2F-85_2F-140_TM-OMRON_20240402.pdf
grasp_motion:
  finger_clearance_radius_m: 0.01
  finger_contact_span_m: 0.02
  finger_clearance_depth_m: 0.025
validation_motion:
  validation_grasp_contact_links:
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link
validation_planning_scene:
  attachment_link: gripper_robotiq_85_base_link
  touch_links:
  - gripper_robotiq_85_left_finger_link
  - gripper_robotiq_85_right_finger_link
# Physical Tool links only. Motion adds the canonical TCP attachment link.
contact_links:
  payload_touch_links:
  - gripper_robotiq_85_left_finger_link
  - gripper_robotiq_85_right_finger_link
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link
  - gripper_robotiq_85_left_inner_knuckle_link
  - gripper_robotiq_85_right_inner_knuckle_link
  # Production PICK Retract contacts, independent of fixture validation policy.
  pick_retract:
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link

# Isaac implementation and optional capabilities are Tool-owned.
runtime:
  isaac_bootstrap: pnp_cnc_cell.runtime_entrypoints:bootstrap_robotiq
  implementation: robotiq_2f85
  actuator: logical
  grasp: fixed_attach
  supported_combinations:
    - [logical, fixed_attach]
    - [physics, fixed_attach]
    - [physics, physical]
  # Presentation metadata only; supported_combinations owns executable support.
  launcher_modes:
    - id: logical_snap
      label: Logical Snap
      combination: [logical, fixed_attach]
      description: 논리적으로 손가락을 구동하고 Fixed Joint로 물체를 고정합니다.
    - id: physical_snap
      label: Physical Snap
      combination: [physics, fixed_attach]
      description: 물리 접촉 반력·폭 Qualification 후 Fixed Joint로 물체를 고정합니다.
    - id: physical_real
      label: Physical Real
      combination: [physics, physical]
      description: 관절 Object Detection으로 파지를 추정하고 접촉·마찰만으로 유지합니다. 미끄러짐·낙하가 가능합니다.
  isaac_prepare: gripper_runtime.physics_model:prepare
  physics:
    primary_joint: gripper_robotiq_85_left_knuckle_joint
    # Drive gains are simulation tuning; force uses the linkage model.
    drive_stiffness: 20.0
    drive_damping: 2.0
    speed_fraction: 0.5
    grip_force_n: 40.0
    position_tolerance_rad: 0.01
    stopped_velocity_rad_s: 0.01
    blocked_dwell_s: 0.15
    holding:
      # Motor-state inference tuning; not calibrated payload retention proof.
      # Initial simulation threshold; validate with payload trials.
      min_contact_force_per_finger_n: 0.1
      width_tolerance_mm: 3.0
      stopped_dwell_s: 0.20
      held_position_tolerance_rad: 0.015
    release:
      # Initial simulation observation thresholds; validate with live trials.
      open_tolerance_mm: 0.5
      position_stability_tolerance_rad: 0.001
      stable_duration_s: 0.20
    contact_material:
      # Uncalibrated rubber-like contact approximation; tune with payload tests.
      static_friction: 1.0
      dynamic_friction: 0.8
      restitution: 0.0
  capabilities: [width, parallel_grasp]
  max_width_mm: 85.0
  move_duration_s: 0.40
  supported_shapes: [box]

# Geometry checked at requested TCP poses; independent of contact exceptions.
grasp_pose_collision_links:
  - gripper_robotiq_85_base_link
  - gripper_robotiq_85_left_knuckle_link
  - gripper_robotiq_85_right_knuckle_link
  - gripper_robotiq_85_left_inner_knuckle_link
  - gripper_robotiq_85_right_inner_knuckle_link
  - gripper_robotiq_85_left_finger_link
  - gripper_robotiq_85_right_finger_link
  - gripper_robotiq_85_left_finger_tip_link
  - gripper_robotiq_85_right_finger_tip_link
