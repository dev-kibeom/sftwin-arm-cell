tool_id: hand_e_c10_long
display_name: Hand-E C10 + 100 mm 핑거
tool_type: radial_gripper
runtime:
  grasp_strategies:
  - internal_radial
  actuator: physics
  grasp: physical
  supported_combinations:
  - - physics
    - physical
  launcher_modes:
  - id: physical_real
    label: Physics
    combination:
    - physics
    - physical
    description: 주축 위치의 목표 미도달·지속 정지로 보유를 추정하고 수축 위치로 해제를 확인합니다. 물리 마찰로 자재를 유지합니다.
  capabilities:
  - joint_position
  - actuator_observation
  primary_joint: gripper_hande_c10_finger_1_joint
  drive_stiffness: 10000.0
  drive_damping: 100.0
  sweep_duration_s: 2.0
  position_tolerance_m: 0.0002
  finger_tip_links: &id001
  - gripper_hande_c10_extension_1
  - gripper_hande_c10_extension_2
  - gripper_hande_c10_extension_3
  implementation: hand_e_c10_physical
  isaac_prepare: gripper_runtime.radial_bootstrap:prepare
  isaac_bootstrap: gripper_runtime.radial_bootstrap:bootstrap
  max_velocity_fraction: 0.5
  physical:
    preload_m: 0.001
    tolerance_m: 0.0002
    dwell_s: 0.15
contact_links:
  payload_touch_links: *id001
  pick_retract: *id001
grasp_pose_collision_links:
- gripper_hand_e_c10_base_link
- gripper_hande_c10_extension_1
- gripper_hande_c10_extension_2
- gripper_hande_c10_extension_3
motion:
  tool_axis_quaternion_xyzw:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
  insertion_axis_tcp:
  - 0.0
  - 0.0
  - 1.0
