    dimension_tolerance_m:
    - 0.01
    - 0.01
    - 0.01
    workspace_roi_m:
      x:
      - -0.3
      - 0.3
      y:
      - -0.2
      - 0.2
      z:
      - 0.01
      - 1.0
    tray_roi_m:
      x:
      - -0.324
      - 0.324
      y:
      - -0.228
      - 0.228
    support_contact_tolerance_m: 0.01
    top_surface_geometry_tolerance_m: 0.01
    minimum_observation_coverage: 0.55
    high_confidence_observed_area_ratio: 0.8
    medium_confidence_observed_area_ratio: 0.55
    support_region_dimensions_m:
    - 0.6336
    - 0.4416
