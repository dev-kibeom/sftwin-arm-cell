    elevated_color_rgb: '#00FFFF'
    other_color_rgb: '#FFFFFF'
  measurement:
    color_rgb: '#FF0000'
    marker_size_px: 24
    line_width_px: 3
  annotation:
    show_text: true
    text_scale: 1.0
    primary_color_rgb: '#FFDC00'
    detail_color_rgb: '#FFFFFF'
detector_profiles:
