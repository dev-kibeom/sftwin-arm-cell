services:
  arm-cell:
    image: sftwin-arm-cell:humble
    build:
      context: .
      dockerfile: Dockerfile
    # Match the host Isaac user so bind-mounted records remain writable.
    user: "${ARM_CELL_UID:-1000}:${ARM_CELL_GID:-1000}"
    network_mode: host
    init: true
    environment:
      HOME: /tmp/arm-cell-home
      ROS_HOME: /tmp/arm-cell-home/.ros
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      FASTDDS_BUILTIN_TRANSPORTS: "${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}"
      ARM_CELL_LOG_LEVEL: "${ARM_CELL_LOG_LEVEL:-info}"
      ARM_CELL_DIAGNOSTICS: "${ARM_CELL_DIAGNOSTICS:-__log_level_default__}"
      SFTWIN_PROJECT_ROOT: /arm_cell
      SFTWIN_MATERIAL_SIDECAR_PORT: "${SFTWIN_MATERIAL_SIDECAR_PORT:-47631}"
      SFTWIN_HUB_SIDECAR_PORT: "${SFTWIN_HUB_SIDECAR_PORT:-47632}"
    volumes:
      - .:/arm_cell
    command: ["/arm_cell/infra/docker/run-arm-cell.sh"]
    restart: unless-stopped
