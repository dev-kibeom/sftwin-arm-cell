  - 공개 native fixture library와 BT는 변경 없는 기준선 빌드를 사용하며 바이너리/BT hash를 각 실행에 보존.
  - 실행 당시 미커밋 소스 hash를 보존. 이후 변경은 설정 검증 확대·미사용 심볼 정리·Stop 각속도 진단 추가이며, 각속도 진단은 실패 시험에서 검증.
  - 수량·간격·설비 배치 변경에는 새 기구학 및 라이브 충돌 검증이 필요.
