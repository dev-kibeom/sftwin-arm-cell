limitations_scope:
  scope: 선택된 3롤 배치의 native Task BT 물리 시험; 정식 ROS Mission 인수 결과가 아님
  limitations:
  - 운영 ROS Motion Backend·Mission·Vision·Safety 통합, HCR-14, HOME-to-cell 및 동적 컨베이어 구동은 미검증/미지원.
