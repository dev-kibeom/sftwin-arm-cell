name: ARM Cell source checks

on:
  push:
  pull_request:

jobs:
  source-sanity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate public ROS package licensing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          paths = list(Path('ros2_ws/src').glob('*/package.xml'))
          missing = [str(path) for path in paths
                     if ET.parse(path).getroot().findtext('license') != 'MIT']
          if missing:
              raise SystemExit('non-MIT project package metadata: ' + ', '.join(missing))
          PY
      - name: Check Python syntax in ARM Cell tooling
        run: |
          python3 -m compileall -q infra/isaac_sim/scripts/m0609_cell
      - name: Verify Launcher and shared configuration
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ros2_ws/src/bringup
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
          python3 -m pip install pytest -r infra/launcher/requirements.txt
          python3 -m pytest -q infra/launcher/tests ros2_ws/src/bringup/tests/test_runtime_export.py ros2_ws/src/bringup/tests/test_configuration_composition.py
